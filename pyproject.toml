[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mme"
version = "0.1.0"
description = "Original math problems where language models tend to go wrong, with corrected solutions verified in SymPy and SciPy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.13", "sympy>=1.13", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mme = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
